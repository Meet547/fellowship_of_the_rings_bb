version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir . --outputs-format json
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*